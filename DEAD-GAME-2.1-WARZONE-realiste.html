
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DEAD GAME 2.1 - WARZONE</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#111;color:white;font-family:Arial}
canvas{display:block}
#hud{border:1px solid #82906c;border-radius:5px;box-shadow:0 5px 24px #0009;backdrop-filter:blur(5px);font-size:14px}
#help{font-size:13px;background:#080b08a8;padding:8px}
button{border-radius:4px;text-shadow:0 1px 2px #000}
input{border-radius:4px}
#menu{
 position:fixed;inset:0;z-index:5;
 background:linear-gradient(#101710dd,#080b08f5);
 display:flex;align-items:center;justify-content:center;
 flex-direction:column;text-align:center
}
h1{font-size:58px;color:#d42c20;letter-spacing:8px;margin:10px}
.subtitle{color:#a9b69c;letter-spacing:4px;margin-bottom:30px}
button{
 background:#a5261d;color:white;border:1px solid #e15a42;
 padding:14px 25px;margin:7px;font-size:17px;
 cursor:pointer;font-weight:bold
}
button:hover{background:#e13a29}
input{padding:13px;background:#222;color:white;border:1px solid #777}
#hud{position:fixed;top:12px;left:12px;z-index:2;
 background:#101710dd;padding:14px;line-height:1.8;
 pointer-events:none}
#help{position:fixed;bottom:10px;left:0;right:0;
 text-align:center;color:white;text-shadow:1px 1px 4px black;
 pointer-events:none}
#network{color:#a9d28a;font-size:13px}
#crosshair{position:fixed;left:50%;top:50%;color:white;
 font-size:25px;transform:translate(-50%,-50%);
 pointer-events:none}
#message{position:fixed;top:45%;width:100%;text-align:center;
 font-size:24px;color:#ffd66c;pointer-events:none}
.hidden{display:none!important}
</style>
</head>
<body>

<div id="menu">
 <h1>DEAD GAME</h1>
 <div class="subtitle">WARZONE 3D • BATTLEFIELD</div>
 <button onclick="startSolo()">JOUER EN SOLO</button>
 <button onclick="createRoom()">CRÉER UNE PARTIE MULTI</button>
 <div style="margin:12px">
  <input id="room" placeholder="ID de la partie à rejoindre">
  <button onclick="joinRoom()">REJOINDRE</button>
 </div>
 <div id="network">Système multijoueur prêt</div>
 <p style="color:#888">TANKS • INFANTERIE • TRANCHÉES</p>
</div>

<div id="hud" class="hidden">
 <b>⚔ DEAD GAME WARZONE</b><br>
 MODE : <span id="mode">SOLO</span><br>
 VIE : <span id="hp">100</span><br>
 VÉHICULE : <span id="vehicle">SOLDAT</span><br>
 MUNITIONS : <span id="ammo">30</span><br>
 SCORE : <span id="score">0</span><br>
 <span id="networkHUD">Hors ligne</span>
</div>
<div id="crosshair" class="hidden">+</div>
<div id="message"></div>
<div id="help" class="hidden">
 ZQSD : BOUGER | SOURIS : REGARDER | CLIC : TIRER |
 E : TANK | ESPACE : OBUS | SHIFT : ACCÉLÉRER
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9aa99a);
scene.fog=new THREE.FogExp2(0x9aa99a,.0038);

const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x424c32,2));
const sun=new THREE.DirectionalLight(0xffe4b0,2);
sun.position.set(-35,75,28);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-100;sun.shadow.camera.right=100;
sun.shadow.camera.top=100;sun.shadow.camera.bottom=-100;
sun.shadow.bias=-0.00025;
scene.add(sun);

const mat=(color,roughness=.9,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
const terrainGeo=new THREE.PlaneGeometry(300,300,100,100);
const pos=terrainGeo.attributes.position;
for(let i=0;i<pos.count;i++){
 const x=pos.getX(i),y=pos.getY(i);
 pos.setZ(i,Math.sin(x*.045)*.65+Math.cos(y*.052)*.55+Math.sin((x+y)*.025)*.45);
}
terrainGeo.computeVertexNormals();
const ground=new THREE.Mesh(terrainGeo,mat(0x687052,1));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
for(let i=0;i<24;i++){
 const patch=new THREE.Mesh(new THREE.CircleGeometry(2+Math.random()*5,20),
  mat(i%2?0x625640:0x77705a,1));
 patch.rotation.x=-Math.PI/2;patch.position.set((Math.random()-.5)*220,.035,(Math.random()-.5)*220);
 patch.scale.y=.45;scene.add(patch);
}

function box(x,y,z,sx,sy,sz,color){
 const o=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat(color));
 o.position.set(x,y,z);
 o.castShadow=true;o.receiveShadow=true;
 scene.add(o);return o;
}

// Champ de bataille
for(let i=0;i<130;i++){
 const x=(Math.random()-.5)*240;
 const z=(Math.random()-.5)*240;
 if(Math.abs(x)<8&&Math.abs(z)<8)continue;
 box(x,.5,z,1+Math.random()*3,1+Math.random()*2,
  1+Math.random()*3,0x514b39);
}

// Tranchées et sacs de sable
for(let z=-35;z<=35;z+=4){
 box(-12,.35,z,1.3,.7,3,0x766b4d);
 box(12,.35,z,1.3,.7,3,0x766b4d);
}
box(0,-.2,0,20,.3,75,0x252a20);
box(-10,.3,0,1,.8,75,0x4b5038);
box(10,.3,0,1,.8,75,0x4b5038);

// Arbres
for(let i=0;i<35;i++){
 const x=(Math.random()-.5)*180,z=(Math.random()-.5)*180;
 box(x,2,z,.8,4,.8,0x453a26);
 const crown=new THREE.Mesh(
  new THREE.SphereGeometry(2.5,7,6),mat(0x33472a));
 crown.position.set(x,5,z);scene.add(crown);
}

function makeTank(color=0x536344){
 const g=new THREE.Group(),armor=mat(color,.78,.22),dark=mat(0x20251f,.95,.12);
 const steel=mat(0x454b43,.55,.55),rubber=mat(0x171a17,1,0);
 function part(geo,m,x,y,z,rx=0,ry=0,rz=0){
  const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.rotation.set(rx,ry,rz);
  o.castShadow=true;o.receiveShadow=true;g.add(o);return o;
 }
 part(new THREE.BoxGeometry(3.35,1.05,4.7),armor,0,1.12,0);
 part(new THREE.BoxGeometry(3.15,.62,1.05),armor,0,1.15,-2.45,.18);
 part(new THREE.BoxGeometry(3.1,.55,.85),dark,0,1.55,1.95);
 part(new THREE.BoxGeometry(2.7,.12,1.8),steel,0,1.86,1.05);
 for(const side of [-1,1]){
  part(new THREE.BoxGeometry(.42,.7,5.15),dark,side*1.83,.78,0);
  part(new THREE.BoxGeometry(.12,.16,5.2),steel,side*2.05,1.08,0);
  for(let z=-2.05;z<=2.06;z+=.68){
   part(new THREE.CylinderGeometry(.43,.43,.22,20),rubber,side*2.08,.68,z,0,0,Math.PI/2);
   part(new THREE.CylinderGeometry(.22,.22,.235,16),steel,side*2.205,.68,z,0,0,Math.PI/2);
   part(new THREE.CylinderGeometry(.09,.09,.25,12),dark,side*2.23,.68,z,0,0,Math.PI/2);
  }
  for(let z=-2.2;z<=2.2;z+=.42)part(new THREE.BoxGeometry(.13,.13,.34),steel,side*2.13,1.12,z);
  part(new THREE.BoxGeometry(.12,.16,4.85),dark,side*2.12,.22,0);
 }
 const turret=new THREE.Group();g.add(turret);turret.position.set(0,1.85,-.15);
 const base=new THREE.Mesh(new THREE.CylinderGeometry(1.18,1.28,.28,12),dark);turret.add(base);
 const top=new THREE.Mesh(new THREE.BoxGeometry(2.35,.88,2.35),armor);top.position.set(0,.52,.05);top.castShadow=true;turret.add(top);
 const mantlet=new THREE.Mesh(new THREE.BoxGeometry(.72,.58,.5),dark);mantlet.position.set(0,.48,-1.15);turret.add(mantlet);
 const barrel=new THREE.Mesh(new THREE.CylinderGeometry(.13,.19,3.4,16),steel);
 barrel.rotation.x=Math.PI/2;barrel.position.set(0,.48,-2.85);turret.add(barrel);
 const muzzle=new THREE.Mesh(new THREE.CylinderGeometry(.2,.2,.32,16),dark);
 muzzle.rotation.x=Math.PI/2;muzzle.position.set(0,.48,-4.48);turret.add(muzzle);
 const cupola=new THREE.Mesh(new THREE.CylinderGeometry(.38,.42,.25,12),dark);cupola.position.set(.45,1.1,.25);turret.add(cupola);
 for(const side of [-1,1]){
  const lamp=new THREE.Mesh(new THREE.SphereGeometry(.13,12,8),new THREE.MeshStandardMaterial({color:0xffe4a1,emissive:0x5a3d16}));
  lamp.position.set(side*1.18,1.25,-2.82);g.add(lamp);
  part(new THREE.BoxGeometry(.18,.2,.12),mat(0x8d241c),side*1.1,1.25,2.42);
 }
 g.userData.turret=turret;
 g.userData.wheels=g.children.filter(o=>o.geometry&&o.geometry.type==="CylinderGeometry");
 return g;
}

function makeSoldier(color=0x75835c){
 const g=new THREE.Group(),uniform=mat(color,.95),boots=mat(0x292b25,1);
 const skin=mat(0xb58c6d,.9),gear=mat(0x454b3a,.95);
 function add(geo,m,x,y,z){const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;g.add(o);return o;}
 add(new THREE.BoxGeometry(.78,1.05,.48),uniform,0,1.22,0);
 add(new THREE.SphereGeometry(.29,16,12),skin,0,2.02,0);
 add(new THREE.SphereGeometry(.34,14,8),gear,0,2.2,0);
 add(new THREE.BoxGeometry(.82,.28,.52),gear,0,1.58,.02);
 add(new THREE.BoxGeometry(.22,.72,.24),uniform,-.25,.48,0);
 add(new THREE.BoxGeometry(.22,.72,.24),uniform,.25,.48,0);
 add(new THREE.BoxGeometry(.24,.18,.3),boots,-.25,.08,-.02);
 add(new THREE.BoxGeometry(.24,.18,.3),boots,.25,.08,-.02);
 add(new THREE.BoxGeometry(.18,.72,.2),uniform,-.5,1.28,-.02);
 add(new THREE.BoxGeometry(.18,.72,.2),uniform,.5,1.28,-.02);
 add(new THREE.BoxGeometry(.16,.16,1.15),mat(0x20231f,.7,.35),.35,1.35,-.62);
 return g;
}
let player,vehicle,driving=false;
let enemies=[],bullets=[],remotes={};
let keys={},yaw=0,pitch=.15,ammo=30,hp=100,score=0;
let playing=false,peer=null,connection=null;
let networkTimer=0;
const clock=new THREE.Clock();

function createPlayer(){
 player=makeSoldier();
 player.position.set(0,0,8);
 scene.add(player);
 vehicle=makeTank();
 vehicle.position.set(5,0,8);
 scene.add(vehicle);
}

function enemy(){
 const e=makeSoldier(0x9b3026);
 e.position.set((Math.random()-.5)*75,0,-30-Math.random()*45);
 scene.add(e);
 enemies.push(e);
}

function startGame(mode){
 document.getElementById("menu").classList.add("hidden");
 ["hud","help","crosshair"].forEach(id=>
  document.getElementById(id).classList.remove("hidden"));
 document.getElementById("mode").textContent=mode;
 createPlayer();
 playing=true;
 if(mode==="SOLO")for(let i=0;i<8;i++)enemy();
 animate();
}

function startSolo(){startGame("SOLO")}

function createRoom(){
 if(!window.Peer){net("PeerJS indisponible");return}
 peer=new Peer();
 peer.on("open",id=>{
  net("TON ID : "+id+" — Donne-le à ton ami !");
  startGame("MULTI");
  document.getElementById("networkHUD").textContent="Salon créé";
 });
 peer.on("connection",conn=>{
  connection=conn;setupConnection(conn);
 });
 peer.on("error",e=>net("Erreur : "+e.type));
}

function joinRoom(){
 const id=document.getElementById("room").value.trim();
 if(!id)return net("Entre un ID de partie");
 peer=new Peer();
 peer.on("open",()=>{
  connection=peer.connect(id);
  setupConnection(connection);
  connection.on("open",()=>{
   net("Connecté à la partie !");
   startGame("MULTI");
  });
 });
 peer.on("error",e=>net("Erreur : "+e.type));
}

function setupConnection(conn){
 connection=conn;
 conn.on("open",()=>{
  net("Joueur connecté !");
  document.getElementById("networkHUD").textContent="En ligne";
 });
 conn.on("data",data=>{
  if(data.type==="state"){
   if(!remotes[data.id]){
    const m=makeSoldier(0x315d9c);
    scene.add(m);remotes[data.id]=m;
   }
   const r=remotes[data.id];
   r.position.set(data.x,0,data.z);
   r.rotation.y=data.yaw;
   r.visible=!data.hidden;
  }
  if(data.type==="shot"){
   // Effet visuel de tir reçu du joueur distant
   flash(data.x,data.z);
  }
 });
 conn.on("close",()=>net("Joueur déconnecté"));
}

function net(s){
 document.getElementById("network").textContent=s;
}

function flash(x,z){
 const m=new THREE.Mesh(new THREE.SphereGeometry(.35,8,8),
 mat(0xffd15c));
 m.position.set(x,1,z);scene.add(m);
 setTimeout(()=>scene.remove(m),180);
}

function shoot(){
 if(!playing||ammo<=0)return;
 ammo--;
 document.getElementById("ammo").textContent=ammo;
 const origin=driving?vehicle.position:player.position;
 const dir=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
 bullets.push({
  pos:new THREE.Vector3(origin.x,driving?2:1.4,origin.z),
  dir:dir.clone(),life:80,damage:1
 });
 if(connection&&connection.open)
  connection.send({type:"shot",x:origin.x,z:origin.z});
}

function shell(){
 if(!playing||!driving)return;
 const p=vehicle.position;
 bullets.push({
  pos:new THREE.Vector3(p.x,2.2,p.z),
  dir:new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),
  life:100,damage:5,shell:true
 });
}

function switchVehicle(){
 if(!playing)return;
 driving=!driving;
 player.visible=!driving;
 vehicle.visible=true;
 document.getElementById("vehicle").textContent=
 driving?"TANK":"SOLDAT";
}

function update(){
 const dt=Math.min(clock.getDelta(),.04);
 if(!playing)return;

 const forward=(keys["z"]||keys["w"]?1:0)-
  (keys["s"]?1:0);
 const side=(keys["d"]?1:0)-(keys["q"]?1:0);
 const speed=driving?(keys["shift"]?13:7):5;

 const target=driving?vehicle:player;
 const dx=-Math.sin(yaw)*forward+Math.cos(yaw)*side;
 const dz=-Math.cos(yaw)*forward-Math.sin(yaw)*side;
 target.position.x+=dx*speed*dt;
 target.position.z+=dz*speed*dt;
 target.position.x=Math.max(-140,Math.min(140,target.position.x));
 target.position.z=Math.max(-140,Math.min(140,target.position.z));
 target.rotation.y=yaw;
 if(driving){
  vehicle.userData.turret.rotation.y=0;
 }

 // Soldat suit le tank quand il est piloté
 if(driving){
  player.position.copy(vehicle.position);
  player.position.x+=3;
 }

 // Ennemis arcade
 for(const e of enemies){
  if(!e.visible)continue;
  const p=driving?vehicle:player;
  const v=new THREE.Vector3(p.position.x-e.position.x,0,
   p.position.z-e.position.z);
  if(v.length()>1.8){
   v.normalize();e.position.addScaledVector(v,1.2*dt);
   e.rotation.y=Math.atan2(-v.x,-v.z);
  }else{
   hp-=.025;
  }
 }

 // Projectiles de jeu
 for(const b of bullets){
  b.pos.addScaledVector(b.dir,b.shell?1.2:1.8);
  b.life--;
  const mesh=new THREE.Mesh(
   new THREE.SphereGeometry(b.shell?.35:.12,8,8),
   mat(b.shell?0xff7b26:0xffe27a));
  mesh.position.copy(b.pos);scene.add(mesh);
  setTimeout(()=>scene.remove(mesh),50);
  for(let i=enemies.length-1;i>=0;i--){
   if(b.pos.distanceTo(enemies[i].position)<1.8){
    scene.remove(enemies[i]);enemies.splice(i,1);
    b.life=0;score+=10;
    if(enemies.length<8)enemy();
    break;
   }
  }
 }
 bullets=bullets.filter(b=>b.life>0);

 // Caméra troisième personne
 const p=driving?vehicle.position:player.position;
 const distance=driving?12:7;
 const height=driving?7:4;
 const desired=new THREE.Vector3(
  p.x+Math.sin(yaw)*distance,
  p.y+height,
  p.z+Math.cos(yaw)*distance
 );
 camera.position.lerp(desired,.12);
 camera.lookAt(p.x,p.y+(driving?1.5:1.3)+pitch*1.8,p.z);

 // Synchronisation réseau
 networkTimer+=dt;
 if(connection&&connection.open&&networkTimer>.08){
  networkTimer=0;
  connection.send({
   type:"state",id:peer.id,
   x:p.x,z:p.z,yaw:yaw,hidden:driving
  });
 }

 document.getElementById("hp").textContent=Math.max(0,Math.floor(hp));
 document.getElementById("score").textContent=score;
 if(hp<=0){
  playing=false;
  document.getElementById("message").textContent="VOUS ÊTES ÉLIMINÉ";
  document.getElementById("menu").classList.remove("hidden");
 }
}

function animate(){
 if(!playing)return;
 requestAnimationFrame(animate);
 update();
 renderer.render(scene,camera);
}

document.addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.key.toLowerCase()==="e")switchVehicle();
 if(e.code==="Space")shell();
 if(e.key.toLowerCase()==="r"){
  ammo=30;document.getElementById("ammo").textContent=ammo;
 }
});
document.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

renderer.domElement.addEventListener("click",()=>{
 if(playing){
  renderer.domElement.requestPointerLock();
  shoot();
 }
});
document.addEventListener("mousemove",e=>{
 if(document.pointerLockElement===renderer.domElement){
  yaw-=e.movementX*.003;
  pitch=Math.max(-.5,Math.min(.8,pitch-e.movementY*.002));
 }
});
window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
